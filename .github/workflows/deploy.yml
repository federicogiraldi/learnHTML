name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CSS lessons are tested in a real browser (Vitest browser mode).
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The service worker and manifest must ship next to index.html so they are served under /learnHTML/.
      - name: Check PWA files
        run: |
          for f in index.html sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png icons/maskable-512.png; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          ls dist/workbox-*.js
          grep -q 'rel="manifest" href="./manifest.webmanifest"' dist/index.html
          if grep -Eq 'picsum\.photos|fonts\.(googleapis|gstatic)\.com' dist/sw.js; then
            echo "::error::external lesson assets must not be precached"; exit 1
          fi
      # Offline support, updates and storage warnings, tested on the build served under /learnHTML/.
      - run: npx tsc -p e2e && npx playwright test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
